#
# Zero Trace Imperium
# Fail2Ban Main Configuration
#

[Definition]

loglevel = INFO

logtarget = /var/log/fail2ban.log

socket = /var/run/fail2ban/fail2ban.sock

pidfile = /var/run/fail2ban/fail2ban.pid

dbfile = /var/lib/fail2ban/fail2ban.sqlite3

dbpurgeage = 1d

allowipv6 = auto

syslogsocket = auto

######################################################################
# General Defaults
######################################################################

[DEFAULT]

ignoreip = 127.0.0.1/8

bantime = 600

findtime = 600

maxretry = 5

backend = systemd

usedns = warn