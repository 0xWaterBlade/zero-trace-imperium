;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Zero Trace Imperium
; PHP Configuration
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[PHP]

engine = On

short_open_tag = Off

expose_php = Off

display_errors = On

display_startup_errors = On

log_errors = On

error_reporting = E_ALL

memory_limit = 256M

max_execution_time = 60

max_input_time = 60

post_max_size = 16M

upload_max_filesize = 8M

max_file_uploads = 20

file_uploads = On

allow_url_fopen = On

allow_url_include = Off

session.use_strict_mode = On

session.cookie_httponly = On

session.use_only_cookies = On

date.timezone = UTC